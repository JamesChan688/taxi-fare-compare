name: Debug NewTaipei
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: check
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          TOKEN=$(curl -s -X POST "https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials&client_id=${TDX_CLIENT_ID}&client_secret=${TDX_CLIENT_SECRET}" \
            | jq -r .access_token)

          echo "--- Try alternate NewTaipei codes ---"
          for CODE in NewTaipei NewTaipeiCity "New Taipei City" Xinbei; do
            ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$CODE")
            CODE_RESULT=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${TOKEN}" \
              "https://tdx.transportdata.tw/api/basic/v2/Road/Traffic/Live/VD/City/${ENC}?%24top=1&%24format=JSON")
            echo "$CODE -> HTTP $CODE_RESULT"
          done

          echo "--- Full Kaohsiung fetch ---"
          curl -s -H "Authorization: Bearer ${TOKEN}" \
            "https://tdx.transportdata.tw/api/basic/v2/Road/Traffic/Live/VD/City/Kaohsiung?%24format=JSON" -o /tmp/kh.json
          echo "byte size:"; wc -c < /tmp/kh.json
          echo "VDLives length:"; jq '.VDLives | length' /tmp/kh.json
          echo "ErrorType distribution:"; jq '[.VDLives[]?.LinkFlows[]?.Lanes[]?.ErrorType] | group_by(.) | map({key:.[0], count: length})' /tmp/kh.json
          echo "Speed field sample (first 3 raw lanes):"; jq '[.VDLives[0,1,2]?.LinkFlows[]?.Lanes[]?] ' /tmp/kh.json

          echo "--- Full Taichung fetch ---"
          curl -s -H "Authorization: Bearer ${TOKEN}" \
            "https://tdx.transportdata.tw/api/basic/v2/Road/Traffic/Live/VD/City/Taichung?%24format=JSON" -o /tmp/tc.json
          echo "byte size:"; wc -c < /tmp/tc.json
          echo "VDLives length:"; jq '.VDLives | length' /tmp/tc.json
