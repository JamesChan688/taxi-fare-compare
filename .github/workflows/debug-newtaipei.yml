name: Debug NewTaipei
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: check
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          TOKEN=$(curl -s -X POST "https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials&client_id=${TDX_CLIENT_ID}&client_secret=${TDX_CLIENT_SECRET}" \
            | jq -r .access_token)
          for CITY in NewTaipei Taichung Kaohsiung; do
            echo "=== $CITY ==="
            curl -s -w "\nHTTP:%{http_code}\n" -H "Authorization: Bearer ${TOKEN}" \
              "https://tdx.transportdata.tw/api/basic/v2/Road/Traffic/Live/VD/City/${CITY}?%24top=3&%24format=JSON" -o /tmp/resp.json -w "HTTP:%{http_code}\n"
            jq '.VDLives | length' /tmp/resp.json
            jq '[.VDLives[]?.LinkFlows[]?.Lanes[]? | .ErrorType] | group_by(.) | map({key: .[0], count: length})' /tmp/resp.json
          done
