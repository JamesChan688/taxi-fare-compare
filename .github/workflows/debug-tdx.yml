name: Debug TDX Response

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch TDX access token and sample response
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          TOKEN_RESP=$(curl -s -X POST "https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials&client_id=${TDX_CLIENT_ID}&client_secret=${TDX_CLIENT_SECRET}")

          echo "Token response keys:"
          echo "$TOKEN_RESP" | jq 'keys'

          TOKEN=$(echo "$TOKEN_RESP" | jq -r .access_token)

          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            echo "Failed to get access token"
            exit 1
          fi

          echo "Got token, length: ${#TOKEN}"

          RESP=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
            "https://tdx.transportdata.tw/api/basic/v2/Road/Traffic/Live/VD/City/Taipei?%24top=5&%24format=JSON")

          echo "$RESP" > /tmp/raw.json

          echo "--- Top-level type ---"
          echo "$RESP" | jq 'type, (if type=="array" then length else keys end)'

          echo "--- Element[0] ---"
          echo "$RESP" | jq '.[0]'

          echo "--- HTTP status check (full count, no top) ---"
          curl -s -o /tmp/full.json -w "HTTP:%{http_code} SIZE:%{size_download}\n" -H "Authorization: Bearer ${TOKEN}" \
            "https://tdx.transportdata.tw/api/basic/v2/Road/Traffic/Live/VD/City/Taipei?%24format=JSON"
          echo "Full VD count for Taipei:"
          jq 'length' /tmp/full.json

      - name: Upload raw response
        uses: actions/upload-artifact@v4
        with:
          name: tdx-raw-response
          path: /tmp/raw.json
          retention-days: 3
